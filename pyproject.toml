[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "learnable-weight-decay"
version = "0.1.0"
description = "Online globally coupled anchored weight rewriting for NanoGPT Track 3"
requires-python = ">=3.10"
dependencies = ["torch>=2.5", "numpy>=1.24", "PyYAML>=6"]

[project.optional-dependencies]
test = ["pytest>=8"]
logging = ["wandb"]

[tool.setuptools.packages.find]
include = ["rewriter*", "baseline*", "chisel*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
