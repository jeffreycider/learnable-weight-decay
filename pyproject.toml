[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "learnable-weight-decay"
version = "0.1.0"
description = "YAML-driven MuonH trajectories and online Chisel consolidation"
requires-python = ">=3.10"
dependencies = ["torch>=2.11", "numpy>=1.24", "PyYAML>=6"]

[project.optional-dependencies]
storage = ["boto3"]
cifar = ["torchvision", "Pillow", "PyYAML>=6"]
test = ["pytest>=8", "boto3"]
logging = ["wandb"]

[tool.setuptools.packages.find]
include = ["baseline*", "chisel*"]

[tool.pytest.ini_options]
testpaths = ["tests/harness"]
