train_steps: 3325
output_dir: runs/nanogpt-yaml
runtime:
  device: cuda
  world_size: 8
  threads: 2
  matmul_precision: high
  autocast: bfloat16
  recompile_limit: 64
seeds:
  initialization: 151400
compile:
  enabled: true
  kwargs:
    fullgraph: true
    dynamic: false
model:
  _target_: baseline.model.GPT
  vocab_size: 50304
  num_layers: 12
  model_dim: 768
  head_dim: 128
  expansion: 4
  causal: true
  attention_scale: 0.12
  learned_qk_scale: false
initialize_model: chisel.models.initialize_muonh
microbatch_size: 32
gradient_units: sum
loss:
  name: torch.nn.functional.cross_entropy
  kwargs:
    label_smoothing: 0.0
optimizers:
  hidden:
    parameters: blocks\.\d+\.(attn\.(q|k|v|proj)|mlp\.(fc|proj))\.weight
    optimizer:
      _target_: chisel.muonh.MuonH
      lr: 0.018
      mu: 0.95
      ns_steps: 12
      compile: true
    tensor_lr: false
    schedule:
      name: chisel.schedules.cooldown
      kwargs:
        fraction: 1.0
  embedding:
    parameters: embed.weight
    optimizer:
      _target_: torch.optim.AdamW
      lr: 0.3
      betas:
      - 0.8
      - 0.95
      eps: 1.0e-10
      weight_decay: 0.0
      fused: true
    tensor_lr: true
    schedule:
      name: chisel.schedules.cooldown
      kwargs:
        fraction: 0.4
  head:
    parameters: proj.weight
    optimizer:
      _target_: torch.optim.AdamW
      lr: 0.003125
      betas:
      - 0.8
      - 0.95
      eps: 1.0e-10
      weight_decay: 0.0
      fused: true
    tensor_lr: true
    schedule:
      name: chisel.schedules.cooldown
      kwargs:
        fraction: 0.4
  scalars:
    parameters: .*\.(bias|gains)
    optimizer:
      _target_: torch.optim.AdamW
      lr: 0.01
      betas:
      - 0.8
      - 0.95
      eps: 1.0e-10
      weight_decay: 0.0
      fused: true
    tensor_lr: true
    schedule:
      name: chisel.schedules.cooldown
      kwargs:
        fraction: 0.4
data:
  _target_: baseline.data.FinewebStream
  filename_pattern: data/fineweb10B/fineweb_train_*.bin
  batch_size: 524288
  seq_len: 1024
  identity_manifest: baseline/vendor/dataset_files.json
evaluation_data:
  _target_: baseline.data.FinewebStream
  filename_pattern: data/fineweb10B/fineweb_val_*.bin
  batch_size: 10485760
  seq_len: 1024
  identity_manifest: baseline/vendor/dataset_files.json
setup:
- name: chisel.training.initialize
- name: chisel.training.model
- name: chisel.training.optimizers
- name: chisel.training.data
- name: chisel.recording.open_run
- name: chisel.recording.restore
pre_forward:
- name: chisel.training.schedule
pre_optimizer: []
post_optimizer:
- name: chisel.evaluation.evaluate
  hyperparams:
    every: 125
    microbatch_size: 32
- name: chisel.recording.progress
  hyperparams:
    every: 1
- name: chisel.recording.checkpoint
  hyperparams:
    every: 250
teardown: []
