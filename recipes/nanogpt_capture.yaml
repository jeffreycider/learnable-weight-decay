extends: nanogpt.yaml
output_dir: runs/nanogpt-trajectory
setup:
- name: chisel.training.initialize
- name: chisel.training.model
- name: chisel.training.optimizers
- name: chisel.training.data
- name: chisel.recording.open_run
- name: chisel.observations.setup
  hyperparams:
    pattern: blocks\.\d+\.(attn\.(q|k|v|proj)|mlp\.(fc|proj))\.weight
- name: chisel.capture.setup
- name: chisel.recording.restore
pre_forward:
- name: chisel.training.schedule
- name: chisel.observations.begin
  hyperparams:
    every: 1
pre_optimizer:
- name: chisel.observations.finish
- name: chisel.capture.record
  hyperparams:
    every: 1
teardown:
- name: chisel.capture.close
- name: chisel.observations.close
